<title>個股健檢小工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: single-column tool — search bar on top, one health-check card below. Finance/trust palette: ink + warm paper, gold accent, semantic teal/slate/amber (避開紅綠=漲跌的混淆). */
:root{
  --bg:#f4f1ea; --surface:#fffdf8; --surface-2:#ece7db;
  --fg:#241f1a; --muted:#6d6456; --line:#ddd5c6;
  --accent:#9a6b1f; --accent-soft:#f0e4c9;
  --good:#1f7a66; --good-bg:#dcefe8;
  --mid:#5a6572; --mid-bg:#e6e8ec;
  --watch:#b1681a; --watch-bg:#f7e7cf;
  --bad:#9c3b3b; --bad-bg:#f3dede;
  --shadow:0 1px 2px rgba(40,30,10,.06),0 8px 24px rgba(40,30,10,.07);
  font-family:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14130f; --surface:#1e1c17; --surface-2:#272420;
  --fg:#efe9df; --muted:#a79e8d; --line:#36322b;
  --accent:#d9a84a; --accent-soft:#3a2f16;
  --good:#5fc3a8; --good-bg:#15332c;
  --mid:#9aa3b0; --mid-bg:#262a30;
  --watch:#e0a155; --watch-bg:#3a2c16;
  --bad:#e08585; --bad-bg:#37201f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14130f; --surface:#1e1c17; --surface-2:#272420;
  --fg:#efe9df; --muted:#a79e8d; --line:#36322b;
  --accent:#d9a84a; --accent-soft:#3a2f16;
  --good:#5fc3a8; --good-bg:#15332c;
  --mid:#9aa3b0; --mid-bg:#262a30;
  --watch:#e0a155; --watch-bg:#3a2c16;
  --bad:#e08585; --bad-bg:#37201f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);margin:0;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:28px 56px}
.tnum{font-variant-numeric:tabular-nums}

header h1{font-size:clamp(1.5rem,5vw,2rem);font-weight:900;margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance}
header p.sub{margin:0;color:var(--muted);font-size:.9rem}
.asof{display:inline-flex;gap:6px;align-items:center;margin-top:10px;font-size:.78rem;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:4px 10px;border-radius:99px}
.asof b{color:var(--accent);font-weight:700}

/* search */
.search{position:relative;margin:22px 0 10px}
.search input{width:100%;font:inherit;font-size:1.05rem;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:.82rem;color:var(--muted);margin:8px 2px 0}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{font:inherit;font-size:.82rem;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:5px 12px;border-radius:99px;transition:.15s}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;z-index:5}
.suggest button{display:flex;width:100%;gap:10px;align-items:baseline;font:inherit;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);color:var(--fg);padding:10px 14px;cursor:pointer}
.suggest button:last-child{border-bottom:0}
.suggest button:hover,.suggest button.on{background:var(--surface-2)}
.suggest .code{font-weight:700;color:var(--accent);min-width:52px;font-variant-numeric:tabular-nums}
.suggest .mk{margin-left:auto;font-size:.75rem;color:var(--muted)}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:20px;margin-top:18px}
.chead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 12px;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:16px}
.chead .nm{font-size:1.5rem;font-weight:900;letter-spacing:-.01em}
.chead .cd{font-size:1.05rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.tag{font-size:.74rem;font-weight:500;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chead .rest{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}

.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:460px){.metrics{grid-template-columns:1fr}}
.metric{border:1px solid var(--line);border-radius:14px;padding:13px 14px;background:var(--bg)}
.metric .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.metric .label{font-size:.8rem;color:var(--muted);font-weight:500}
.metric .val{font-size:1.65rem;font-weight:900;letter-spacing:-.02em;margin:2px 0 2px}
.metric .val small{font-size:.9rem;font-weight:700;color:var(--muted);margin-left:2px}
.metric .note{font-size:.8rem;color:var(--muted);line-height:1.45}
.badge{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap}
.b-good{background:var(--good-bg);color:var(--good)}
.b-mid{background:var(--mid-bg);color:var(--mid)}
.b-watch{background:var(--watch-bg);color:var(--watch)}
.b-bad{background:var(--bad-bg);color:var(--bad)}

.scale{font-size:.9rem;color:var(--fg);background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-top:16px;line-height:1.55}
.scale b{color:var(--accent)}

.size{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:.85rem;color:var(--muted)}
.size div b{display:block;color:var(--fg);font-size:1.05rem;font-weight:700;font-variant-numeric:tabular-nums}

/* checklist */
.checks{margin-top:18px}
.checks h3{font-size:1rem;margin:0 0 10px;font-weight:700}
.checks ol{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:9px}
.checks li{font-size:.92rem}
.checks li span{color:var(--muted);font-size:.86rem;display:block}

.disc{font-size:.8rem;color:var(--muted);line-height:1.55;margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.disc b{color:var(--fg)}
.etf{font-size:.95rem;line-height:1.7}
.etf .big{font-size:1.1rem;font-weight:700;color:var(--accent);display:block;margin-bottom:6px}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:.95rem}
a.src{color:var(--accent)}
</style>

// ---- 指標評級（新手參考門檻，非絕對） ----
function pe(v){
  if(v==null) return {lv:"bad",tx:"虧損 badge",badge:"沒有本益比",note:"公司最新沒有正的獲利（可能虧損或轉虧），所以算不出本益比。新手通常先避開。"};
  if(v<=0)   return {lv:"bad",badge:"異常",note:"本益比為負或零，代表沒有正獲利，新手先避開。"};
  if(v<15)   return {lv:"good",badge:"相對便宜",note:"股價相對獲利不算貴。但也要確認是「真便宜」還是「獲利在衰退」。"};
  if(v<25)   return {lv:"mid",badge:"合理區間",note:"多數穩健公司落在這附近，屬中性。"};
  if(v<40)   return {lv:"watch",badge:"偏高",note:"市場給了成長期待，股價不便宜；要靠公司持續成長才撐得住。"};
  return {lv:"bad",badge:"很高",note:"本益比非常高，市場期待很高、風險也大。一旦成長不如預期，容易大跌。"};
}
function yld(v){
  if(v==null||v<0.5) return {lv:"mid",badge:"幾乎不配息",note:"配息很少或不配。常見於把錢拿去成長的公司，想領息的人不適合。"};
  if(v>=5)  return {lv:"good",badge:"高殖利率",note:"配息相對大方，存股族喜歡。但要留意高殖利率是否因股價下跌造成。"};
  if(v>=3)  return {lv:"good",badge:"中上",note:"配息水準不錯，約等於或優於定存、大盤平均。"};
  return {lv:"mid",badge:"偏低",note:"配息普通。成長股常見，重點看公司會不會長大。"};
}
function pb(v){
  if(v==null) return {lv:"mid",badge:"—",note:"無資料。"};
  if(v<1)  return {lv:"good",badge:"低於淨值",note:"股價低於公司帳面淨值。可能被低估，也可能是市場不看好，要再查原因。"};
  if(v<3)  return {lv:"mid",badge:"中性",note:"多數公司落在這區間，屬正常。"};
  if(v<6)  return {lv:"watch",badge:"偏高",note:"股價是淨值的好幾倍，市場評價較高。"};
  return {lv:"bad",badge:"很高",note:"遠高於淨值，多是熱門成長股，追高風險大。"};
}
function epsStat(v){
  if(v==null) return {lv:"bad",badge:"無資料／虧損",note:"最新財報沒有正的每股盈餘。公司可能在虧錢，新手避開。"};
  if(v<=0)    return {lv:"bad",badge:"虧損",note:"最新財報每股是虧損的。新手請避開沒在賺錢的公司。"};
  if(v<1)     return {lv:"mid",badge:"小賺",note:"有賺錢，但每股盈餘不高。"};
  return {lv:"good",badge:"有賺錢",note:"最新財報每股有正獲利，這是最基本的健康條件。"};
}

const BADGECLS={good:"b-good",mid:"b-mid",watch:"b-watch",bad:"b-bad"};

  return `<div class="metric">

}

        <span class="tag">${d.m}</span>

      </span>
    </div>
    <div class="metrics">
      ${metricHTML("本益比 P/E　<small style='color:var(--muted)'>股價 ÷ 獲利</small>", d.pe!=null?`${fmt(d.pe,1)}<small>倍</small>`:"—", rPe)}
      ${metricHTML("現金殖利率　<small style='color:var(--muted)'>配息 ÷ 股價</small>", d.y!=null?`${fmt(d.y,2)}<small>%</small>`:"—", rY)}
      ${metricHTML("最新 EPS　<small style='color:var(--muted)'>每股賺多少</small>", d.eps!=null?`${fmt(d.eps,2)}<small>元</small>`:"—", rE)}
      ${metricHTML("股價淨值比 P/B", d.pb!=null?`${fmt(d.pb,2)}<small>倍</small>`:"—", rPb)}
    </div>

    <div class="size">
      <div>最新營收（${META.epsp||""}）<b>${money(d.rev)}</b></div>
      <div>最新稅後淨利<b>${money(d.ni)}</b></div>
    </div>

    <div class="scale"><b>白話總結：</b>${plain(d,rPe,rY,rE)}${divline}。</div>

    <div class="checks">
      <h3>買之前，先問自己 4 題</h3>
      <ol>
        <li>這家公司靠什麼賺錢，我講得出來嗎？<span>講不出來 → 別買。</span></li>
        <li>它最近有在賺錢嗎？<span>看上面「最新 EPS」是不是正的、而且逐年穩定。</span></li>
        <li>我買它，是因為我懂它，還是因為聽人說會漲？<span>後者 → 別買。</span></li>
        <li>如果它明天跌 30%，我睡得著嗎？<span>睡不著 → 買太多了，降低金額。</span></li>
      </ol>
    </div>

    <div class="disc">
      <b>這份健檢只看「基本面快照」</b>，不預測漲跌。門檻（便宜／偏高）是給新手的粗略參考，不同產業標準差很大（例如科技成長股本益比天生較高）。<br>
      想看<b>近 5 年 EPS 與配息歷史</b>（本工具只有最新一期），可查「公開資訊觀測站」或你的券商 App。<br>
      投資一定有風險，以上為資訊整理，<b>非投資建議</b>。
    </div>
  </div>`;
  R.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function plain(d,rPe,rY,rE){
  let parts=[];
  if(rE.lv==="bad") parts.push("最新財報<b>沒在賺錢</b>，對新手是明顯的警訊");
  else parts.push(`公司<b>有在賺錢</b>（每股約 ${fmt(d.eps,2)} 元）`);
  if(d.pe!=null){
    if(rPe.lv==="good")parts.push("股價相對獲利<b>不算貴</b>");
    else if(rPe.lv==="mid")parts.push("估值<b>合理</b>");
    else parts.push("股價<b>偏貴</b>，追高要小心");
  }
  if(rY.lv==="good")parts.push("<b>配息大方</b>，適合領息");
  else if(d.y!=null && d.y<1)parts.push("<b>幾乎不配息</b>（偏成長型）");
  return parts.join("、");
}

// ---- 搜尋 / 建議 ----
const LIST=Object.values(S).map(d=>({c:d.c,n:d.n,m:d.m}));
let selIdx=-1, curSug=[];
function search(term){
  term=term.trim();
  if(!term) return [];
  const byCode=LIST.filter(x=>x.c.startsWith(term));
  const byName=LIST.filter(x=>x.n.includes(term)&&!x.c.startsWith(term));
  const etfs=Object.keys(ETF).filter(c=>c.startsWith(term)).map(c=>({c,n:"ETF",m:"ETF"}));
  return [...etfs,...byCode,...byName].slice(0,8);
}
function showSug(){
  const box=$("#suggest");
  if(!curSug.length){box.hidden=true;return;}
  box.innerHTML=curSug.map((x,i)=>
    `<button data-code="${x.c}" class="${i===selIdx?'on':''}"><span class="code">${x.c}</span><span>${x.n}</span><span class="mk">${x.m}</span></button>`
  ).join("");
  box.hidden=false;
  box.querySelectorAll("button").forEach(b=>b.onclick=()=>pick(b.dataset.code));
}
function pick(code){
  $("#q").value=code;
  $("#suggest").hidden=true; selIdx=-1;
  renderStock(code);
}
$("#q").addEventListener("input",e=>{
  curSug=search(e.target.value); selIdx=-1; showSug();
});
$("#q").addEventListener("keydown",e=>{
  if($("#suggest").hidden) {
    if(e.key==="Enter"){const t=e.target.value.trim(); if(t)pick(curSug[0]?curSug[0].c:t.toUpperCase());}
    return;
  }
  if(e.key==="ArrowDown"){e.preventDefault();selIdx=Math.min(selIdx+1,curSug.length-1);showSug();}
  else if(e.key==="ArrowUp"){e.preventDefault();selIdx=Math.max(selIdx-1,-1);showSug();}
  else if(e.key==="Enter"){e.preventDefault();pick(selIdx>=0?curSug[selIdx].c:(curSug[0]?curSug[0].c:e.target.value.trim()));}
  else if(e.key==="Escape"){$("#suggest").hidden=true;selIdx=-1;}
});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))$("#suggest").hidden=true;});
